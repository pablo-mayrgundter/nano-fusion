<svg class="pf-chart" viewBox="0 0 880 470" role="img" tabindex="0" data-left="76" data-top="30" data-w="620" data-h="380" data-xlo="-0.69897" data-xhi="1.77815" data-ylo="-110.0" data-yhi="15.0" data-vw="880" data-vh="470" aria-label="Fusion rate per pair per second against the screening length of the surrounding electrons, for D-D, p-6Li, p-7Li and p-11B. The rate rises by tens of orders of magnitude as the screening length shrinks from 53 picometres toward 0.3. D-D reaches the range a battery needs near 1 to 1.5 picometres, the lithium fuels near 0.5 and boron near 0.4. A muon gives 0.26 picometres for hydrogen pairs only.">
